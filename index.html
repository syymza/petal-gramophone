<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7e8df"><link rel="icon" href="data:,"><title>Petal</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<main id="app"><header><a class="brand" href="./" aria-label="Petal home">petal</a><button id="trayButton" aria-label="Open mechanism tray">Open box</button></header>
<div id="stage"><canvas id="view" aria-label="Wooden gramophone, brass pin cylinder and tuned steel comb"></canvas><label id="dialControl" aria-label="Cabinet tune selector"><span class="dial" aria-hidden="true"><i></i></span><select id="tune" aria-label="Select tune"></select></label></div>
<section id="composer" hidden aria-label="Compose on the cylinder">
 <div class="editor-top"><label class="pitch-control">Pitch <select id="pitch" aria-label="Pitch to place on cylinder"></select></label><button id="flatToggle" aria-pressed="false">Unwrap pins</button></div>
 <div id="flatPanel" hidden><div class="grid-head"><button id="lower" aria-label="Lower pitch range">Lower</button><span id="range"></span><button id="higher" aria-label="Higher pitch range">Higher</button></div><div id="pinGrid" role="group" aria-label="Unwrapped cylinder pins: pitch rows, time columns"></div></div>
 <div class="turn-controls"><button id="back" aria-label="Previous cylinder position">Back</button><span id="position" aria-live="polite"></span><button id="next" aria-label="Next cylinder position">Next</button></div>
 <div class="edit-controls"><button id="eraseMode" aria-pressed="false">Erase</button><button id="undo" disabled>Undo</button><button id="clear">Clear</button><button id="editDone">Done</button></div><p id="editHint">Tap the lit socket · drag to turn</p>
</section>
<footer><h1 id="tuneTitle"></h1><button id="copy">Copy to Yours</button><div class="transport-controls"><button id="crank" aria-label="Wind spring and play">Wind &amp; play</button><button id="needleButton" aria-label="Play music">Play</button><span id="spring" role="meter" aria-label="Spring winding" aria-valuemin="0" aria-valuemax="180" aria-valuenow="0"><i></i></span><button id="editStart" hidden>Edit pins</button></div></footer>
<dialog id="copyDialog" aria-labelledby="copyTitle"><h2 id="copyTitle">Replace Yours?</h2><p>Your saved melody stays safe until you replace it. You can undo the replacement.</p><div><button id="cancelCopy">Keep Yours</button><button id="confirmCopy">Replace Yours</button></div></dialog>
<span id="status" class="sr-only" role="status" aria-live="polite"></span><div id="loading" role="status">Opening the box…</div><div id="fallback" hidden>This browser could not open the instrument. Try a browser with WebGL enabled.</div></main><script type="module" src="app.js"></script></body></html>
